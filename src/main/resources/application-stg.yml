spring:
  config:
    activate:
      on-profile: stg
  activemq:
    in-memory: false
    broker-url: ${ACTIVEMQ_BROKER_URL}
    user: ${ACTIVEMQ_USER:}
    password: ${ACTIVEMQ_PASSWORD:}
  datasource:
    url: ${GYMCRM_STG_DB_URL}
    username: ${GYMCRM_STG_DB_USERNAME}
    password: ${GYMCRM_STG_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
