spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:gymcrm-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.gymcrm: DEBUG
