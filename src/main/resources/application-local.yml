spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:gymcrm-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

gymcrm:
  security:
    jwt:
      # Local-only fallback. Set GYMCRM_JWT_SECRET outside local development.
      secret: ${GYMCRM_JWT_SECRET:local-development-secret-must-be-at-least-32-characters}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.gymcrm: DEBUG
