spring:
  config:
    activate:
      on-profile: dev
  activemq:
    in-memory: false
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:}
    password: ${ACTIVEMQ_PASSWORD:}
  datasource:
    url: jdbc:h2:file:./data/gymcrm-dev;AUTO_SERVER=TRUE;MODE=PostgreSQL
    username: gymcrm_dev
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.gymcrm: DEBUG
