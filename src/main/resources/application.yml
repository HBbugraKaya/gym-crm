server:
  port: 8081

spring:
  application:
    name: gym-crm
  profiles:
    active: local
  artemis:
    mode: embedded

logging:
  file:
    name: logs/gym-crm.log
  pattern:
    level: "%5p [txId: %X{transactionId}]"

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, prometheus

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

