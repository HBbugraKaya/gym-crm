spring:
  application:
    name: spring-boot-gym-crm
  profiles:
    default: local
  jpa:
    open-in-view: false

gymcrm:
  jms:
    queues:
      trainer-workload: gym.trainer.workload
      trainee-deletion-report: gym.trainee.deletion-report
  security:
    jwt:
      secret: ${GYMCRM_JWT_SECRET}
      issuer: ${GYMCRM_JWT_ISSUER}
      access-token-ttl: PT1H
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:4200

management:
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

info:
  application:
    name: ${spring.application.name}
    description: Gym trainee, trainer and training management API

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [transactionId=%X{transactionId:-none}] [%thread] %logger{36} - %msg%n"
  level:
    com.example.gymcrm: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: "OFF"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
