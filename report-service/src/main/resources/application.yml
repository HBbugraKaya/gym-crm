server:
  port: 8092

spring:
  application:
    name: trainee-report-service
  profiles:
    default: local

gymcrm:
  security:
    jwt:
      secret: ${GYMCRM_JWT_SECRET}
      issuer: ${GYMCRM_JWT_ISSUER}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [transactionId=%X{transactionId:-none}] [%thread] %logger{36} - %msg%n"
  level:
    com.example.gymcrm.report: INFO
