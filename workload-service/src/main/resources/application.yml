server:
  port: 8091

spring:
  application:
    name: trainer-workload-service
  profiles:
    default: local
  data:
    mongodb:
      auto-index-creation: true
  jms:
    listener:
      concurrency: 1
      max-concurrency: 3

gymcrm:
  jms:
    queues:
      trainer-workload: gym.trainer.workload
      trainer-workload-dlq: gym.trainer.workload.dlq
  security:
    jwt:
      secret: ${GYMCRM_JWT_SECRET}
      issuer: ${GYMCRM_JWT_ISSUER}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [transactionId=%X{transactionId:-none}] [%thread] %logger{36} - %msg%n"
  level:
    com.example.gymcrm.workload: INFO
